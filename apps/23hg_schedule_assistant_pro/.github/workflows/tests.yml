name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài LibreOffice (cho test công thức Excel)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Cài thư viện Python
        run: pip install -r requirements.txt
      - name: Chạy bộ kiểm thử
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
