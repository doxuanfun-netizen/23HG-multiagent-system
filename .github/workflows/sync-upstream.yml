name: Sync fork with upstream

# Tự động kéo thay đổi từ repo gốc (baotuhg/23HG-multiagent-system) về fork này.
# Chạy mỗi giờ, hoặc bấm "Run workflow" trong tab Actions để chạy ngay.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Chỉ chạy trên fork, không chạy trên repo gốc.
    if: github.repository != 'baotuhg/23HG-multiagent-system'
    runs-on: ubuntu-latest
    steps:
      - name: Sync default branch from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ github.event.repository.default_branch }}"
          gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch="$branch"
